{% if items.has_other_pages %}
<nav class="pagination" aria-label="Pagination"><span>{{ items.start_index }}–{{ items.end_index }} of {{ items.paginator.count }}</span>
<div>{% if items.has_previous %}<a class="button secondary small" href="?{{ filter_query }}&page={{ items.previous_page_number }}">← Previous</a>{% endif %}<span>Page {{ items.number }} of {{ items.paginator.num_pages }}</span>{% if items.has_next %}<a class="button secondary small" href="?{{ filter_query }}&page={{ items.next_page_number }}">Next →</a>{% endif %}
</div>
</nav>
{% endif %}
